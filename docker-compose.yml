services:
  core:
    build:
      context: .
      dockerfile: packages/core/Dockerfile
    image: social-manifold/core:dev
    stdin_open: true
    tty: false
    restart: "no"
    environment:
      CORE_IDEMPOTENCY_DB: /var/lib/social-manifold/idempotency.db
      CORE_PERSONAS_ROOT: /var/social-manifold/personas
      CHILD_DISCORD_SOCKET_PATH: /run/social-manifold/children/discord.sock
    networks:
      - manifold_core
    volumes:
      # personas dir read-only — core reads identity.yaml for cadence config
      - ./personas:/var/social-manifold/personas:ro
      # idempotency ledger persists across restarts (Plan 4 §9)
      - core_state:/var/lib/social-manifold
      # MCP children sockets (and core's own when added later)
      - /run/social-manifold:/run/social-manifold

  vault:
    build:
      context: .
      dockerfile: services/persona-vault/Dockerfile
    image: social-manifold/persona-vault:dev
    restart: unless-stopped
    networks:
      - manifold_core
    volumes:
      # personas directory mounted read-only — vault never writes back
      - ./personas:/var/social-manifold/personas:ro
      # age key bind-mounted from the host path defined in .env
      - ${AGE_KEY_PATH:-./personas/_staging_alpha/.age.key}:/etc/social-manifold/age.key:ro
      # canonical Unix-socket directory; created by scripts/setup-runtime-dir.sh
      # — compose does NOT create it, see ops/local/runbook.md
      - /run/social-manifold:/run/social-manifold
      # audit log persists across restarts
      - vault_audit:/var/lib/social-manifold

  child-discord:
    build:
      context: .
      dockerfile: packages/child-discord/Dockerfile
    image: social-manifold/child-discord:dev
    restart: unless-stopped
    depends_on:
      - vault
    environment:
      CHILD_DISCORD_SOCKET_PATH: /run/social-manifold/children/discord.sock
      VAULT_SOCKET_PATH: /run/social-manifold/vault.sock
    volumes:
      # MCP-over-UDS — bind both vault.sock and the children/ dir from the host.
      # Created by scripts/setup-runtime-dir.sh (see ops/local/runbook.md).
      - /run/social-manifold:/run/social-manifold

networks:
  manifold_core:
    driver: bridge

volumes:
  vault_audit:
  core_state:
